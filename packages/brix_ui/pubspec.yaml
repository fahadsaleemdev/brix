name: brix_ui
description: "Flutter widgets that follow your theme: buttons, text fields, select and search, cards, sheets, dialogs, toasts and a loader, in light and dark. Part of the brix family."
version: 1.2.1
repository: https://github.com/mrubaz/brix/tree/main/packages/brix_ui
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - ui
  - widgets
  - theme
  - dark-mode

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  brix: ^1.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: "Search: a field with suggestions and a free value, and a select with a search box."
    path: doc/screenshots/search.png
  - description: "Cards: plain, with a status accent, and one with its own style in dark."
    path: doc/screenshots/card.png
  - description: "Text styles from large title to caption, in light and dark."
    path: doc/screenshots/text_scale.png
  - description: "One kit in three brands: default, own colours with round corners, a dark brand with sharp corners."
    path: doc/screenshots/your_brand.png
  - description: "Buttons: filled, gradient, outlined, destructive, loading and disabled."
    path: doc/screenshots/buttons.png
  - description: "Text fields with a label, a required error, a password and a read only field."
    path: doc/screenshots/text_fields.png
  - description: "A select: filled in, a menu for a few options, a sheet for many."
    path: doc/screenshots/select.png
  - description: "Sheets: a list of choices, a short form, half height in dark mode."
    path: doc/screenshots/sheets.png
  - description: "Dialogs over a real screen: a warning, an error and a question that returns a value."
    path: doc/screenshots/dialogs.png
  - description: "Success toasts at the top of the screen."
    path: doc/screenshots/toast.png
